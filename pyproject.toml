[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vidpress"
version = "1.0.0"
description = "A CLI toolkit for compressing and manipulating videos via ffmpeg"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    {name = "Pourya", email = "pouryathesaymon@gmail.com"}
]
keywords = ["video", "compression", "ffmpeg", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video :: Conversion",
]

dependencies = [
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0",
]
test = ["pytest>=7.0", "pytest-cov>=4.0"]
docs = ["mkdocs>=1.4", "mkdocs-material>=9.0"]

[project.scripts]
vidpress = "vidpress.cli:cli"

[project.urls]
Repository = "https://github.com/pousay/vidpress"
Issues = "https://github.com/pousay/vidpress/issues"
Documentation = "https://github.com/pousay/vidpress#readme"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vidpress*"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "C", "N", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--verbose --cov=src/vidpress --cov-report=html --cov-report=term"

[tool.coverage.run]
source = ["src/vidpress"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
]
