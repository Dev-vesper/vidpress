[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vidpress"
version = "1.0.0"
description = "A CLI toolkit for compressing and manipulating videos via ffmpeg"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
]

[project.scripts]
vidpress = "vidpress:cli"

[project.urls]
Repository = "https://github.com/pousay/vidpress"

[tool.setuptools.packages.find]
where = ["."]